services:
  db:
    image: postgis/postgis:16-3.4
    container_name: artisan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: artisan
      POSTGRES_PASSWORD: artisan
      POSTGRES_DB: artisan
    ports:
      - "5432:5432"
    volumes:
      - artisan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artisan -d artisan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artisan-db-data:
